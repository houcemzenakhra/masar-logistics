# Local Postgres for running the web app against a real database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: masar
      POSTGRES_PASSWORD: masar
      POSTGRES_DB: masar
    ports:
      - "5432:5432"
    volumes:
      - masar-db:/var/lib/postgresql/data
volumes:
  masar-db:
