name: masar_mobile
description: Masar for couriers, hub teams and merchants. One app; the account that signs in decides which screens appear.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.0.1
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
